name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run gen:schema
      - name: Reject uncommitted schema changes
        run: git diff --exit-code -- config.schema.json
      - run: npm test
      - run: npm run smoke
      - run: npm run verify:package
      - run: npm audit --omit=dev --audit-level=high
